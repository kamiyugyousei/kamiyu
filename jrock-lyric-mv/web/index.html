html { background: var(--bg); }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--f-num); font-size: 12px; letter-spacing: 0.14em; color: var(--teal); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 span { color: var(--pink); }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }

.stage { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #000; }
#c { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: #000; }

.transport { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.transport input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--pink); }
.time { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

button, select {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 16px; cursor: pointer;
}
button:hover:not(:disabled), select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: default; }
.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; padding: 11px 22px; }
.primary:hover:not(:disabled) { border-color: #fff; }

.cues { display: grid; grid-template-columns: 1fr 1.5fr 1.5fr 1fr; gap: 3px; }
.cue { text-align: left; padding: 8px 10px; display: grid; gap: 1px; min-width: 0; border-radius: 4px; }
.cue small { font-family: var(--f-num); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cue b { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.cue.on { border-color: var(--pink); }

.desk { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; }
.desk h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
label { color: var(--muted); font-size: 13px; }
.bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--teal)); transition: width 0.1s linear; }
.status { margin: 0; min-height: 1.7em; font-size: 14px; }
.status.err { color: var(--warn); }
.result { display: grid; gap: 10px; }
.result video { width: 100%; max-width: 480px; border-radius: 6px; border: 1px solid var(--line); }
.note { color: var(--muted); font-size: 13px; margin: 0; }

@media (max-width: 560px) {
  .cues { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

  const FRAMES = Math.round(DUR * FPS);
  let audioBuf = null, actx = null, playing = false, src = null, blob = null, busy = false;

  const fmt = t => `${t.toFixed(2)} / ${DUR.toFixed(2)} 秒`;
  function show(f) {
    f = Math.max(0, Math.min(FRAMES - 1, f));
    render(f / FPS);
    $('scrub').value = f; $('time').textContent = fmt(f / FPS);
    document.querySelectorAll('.cue').forEach(c => {
      const t = f / FPS, a = +c.dataset.t;
      const [s, e] = a < 1 ? [0, 1] : a < 2.5 ? [1, 2.5] : a < 4 ? [2.5, 4] : [4, 5];
      c.classList.toggle('on', t >= s && t < e);
    });
  }
  const status = (msg, err) => { $('status').textContent = msg; $('status').classList.toggle('err', !!err); };
  const progress = u => { $('bar').style.width = `${Math.round(u * 100)}%`; };

  async function loadAudio() {
    const ab = await (await fetch('audio.wav')).arrayBuffer();
    const off = new OfflineAudioContext(2, 44100, 44100);
    audioBuf = await off.decodeAudioData(ab);
  }
  async function resample(rate) {
    const n = Math.round(DUR * rate);
    const off = new OfflineAudioContext(2, n, rate);
    const s = off.createBufferSource(); s.buffer = audioBuf; s.connect(off.destination); s.start();
    return off.startRendering();
  }

  // ----- preview playback -----
  function stop() {
    playing = false; $('play').textContent = '▶ 再生';
    if (src) { try { src.stop(); } catch (e) {} src = null; }
  }
  async function play() {
    if (playing) { stop(); return; }
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    const from = +$('scrub').value >= FRAMES - 1 ? 0 : +$('scrub').value / FPS;
    src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(actx.destination);
    const t0 = actx.currentTime + 0.05 - from; src.start(actx.currentTime + 0.05, from);
    playing = true; $('play').textContent = '❚❚ 停止';
    const tick = () => {
      if (!playing) return;
      const t = actx.currentTime - t0;
      if (t >= DUR) { stop(); show(FRAMES - 1); return; }
      show(Math.max(0, Math.round(t * FPS)));
      requestAnimationFrame(tick);
    };
    tick();
  }

  // ----- export -----
  async function pickVideo(w, h) {
    // H.264 plays everywhere; VP9 is the fallback for browsers built without it.
    for (const [kind, codec] of [['avc', 'avc1.640028'], ['avc', 'avc1.4d0028'], ['avc', 'avc1.42e028'], ['vp9', 'vp09.00.40.08']]) {
      const cfg = { codec, width: w, height: h, bitrate: w > 1280 ? 14e6 : 8e6, framerate: FPS };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { kind, cfg }; } catch (e) {}
    }
    return null;
  }
  async function pickAudio() {
    if (!('AudioEncoder' in window)) return null;
    for (const [kind, codec, rate] of [['aac', 'mp4a.40.2', 44100], ['aac', 'mp4a.40.2', 48000], ['opus', 'opus', 48000]]) {
      const cfg = { codec, sampleRate: rate, numberOfChannels: 2, bitrate: 192000 };
      try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { kind, cfg }; } catch (e) {}
    }
    return null;
  }
  const yieldUI = () => new Promise(r => setTimeout(r, 0));

  async function exportWebCodecs(w, h) {
    const vsel = await pickVideo(w, h);
    if (!vsel) return null;
    const vcfg = vsel.cfg;
    const acfg = await pickAudio();
    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target, fastStart: 'in-memory', firstTimestampBehavior: 'offset',
      video: { codec: vsel.kind, width: w, height: h, frameRate: FPS },
      audio: acfg ? { codec: acfg.kind, numberOfChannels: 2, sampleRate: acfg.cfg.sampleRate } : undefined,
    });
    let failure = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { failure = e; } });
    venc.configure(vcfg);
    const out = w === cv.width ? cv : Object.assign(document.createElement('canvas'), { width: w, height: h });
    const octx = out === cv ? null : out.getContext('2d');
    for (let f = 0; f < FRAMES; f++) {
      if (failure) throw failure;
      render(f / FPS);
      if (octx) octx.drawImage(cv, 0, 0, w, h);
      const frame = new VideoFrame(out, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(frame, { keyFrame: f % FPS === 0 });
      frame.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 4));
      progress(0.9 * (f + 1) / FRAMES);
      status(`フレームを描いています… ${f + 1} / ${FRAMES}`);
      await yieldUI();
    }
    await venc.flush(); venc.close();
    if (acfg) {
      status('音声を書き出しています…');
      const buf = await resample(acfg.cfg.sampleRate);
      const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { failure = e; } });
      aenc.configure(acfg.cfg);
      const CH = 4096, n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
      for (let i = 0; i < n; i += CH) {
        const m = Math.min(CH, n - i), data = new Float32Array(m * 2);
        data.set(L.subarray(i, i + m), 0); data.set(R.subarray(i, i + m), m);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: acfg.cfg.sampleRate, numberOfFrames: m, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / acfg.cfg.sampleRate), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush(); aenc.close();
      if (failure) throw failure;
    }
    muxer.finalize();
    progress(1);
    return { blob: new Blob([target.buffer], { type: 'video/mp4' }), ext: 'mp4', audio: !!acfg, vp9: vsel.kind === 'vp9' };
  }

  // Fallback for browsers without WebCodecs: record the canvas in real time.
  async function exportRealtime() {
    if (!cv.captureStream || !window.MediaRecorder) return null;
    const type = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    if (!type) return null;
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    const dest = actx.createMediaStreamDestination();
    const s = actx.createBufferSource(); s.buffer = audioBuf; s.connect(dest);
    const stream = new MediaStream([...cv.captureStream(FPS).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12e6 });
    const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    render(0); rec.start(); const t0 = actx.currentTime + 0.05; s.start(t0);
    await new Promise(resolve => {
      const tick = () => {
        const t = actx.currentTime - t0;
        if (t >= DUR) { resolve(); return; }
        render(Math.max(0, t)); progress(Math.max(0, t) / DUR);
        status(`リアルタイムで録画しています… ${Math.max(0, t).toFixed(1)} 秒`);
        requestAnimationFrame(tick);
      };
      tick();
    });
    rec.stop(); await done; progress(1);
    return { blob: new Blob(parts, { type }), ext: type.startsWith('video/mp4') ? 'mp4' : 'webm', audio: true };
  }

  async function doExport() {
    if (busy) return;
    busy = true; stop();
    $('export').disabled = $('play').disabled = true; $('result').hidden = true; progress(0);
    const [w, h] = $('quality').value === '720' ? [1280, 720] : [1920, 1080];
    try {
      let res = null;
      if ('VideoEncoder' in window && window.Mp4Muxer) res = await exportWebCodecs(w, h);
      if (!res) res = await exportRealtime();
      if (!res) { status('このブラウザは動画の書き出しに対応していません。Chrome・Edge・Safariの最新版で開いてください。', true); return; }
      blob = res.blob; blob.ext = res.ext; blob.h = h;
      $('out').src = URL.createObjectURL(blob);
      $('size').textContent = `${res.ext.toUpperCase()} · ${(blob.size / 1048576).toFixed(1)} MB${res.audio ? '' : ' · 音声なし（このブラウザは音声の書き出しに未対応）'}${res.vp9 ? ' · VP9形式（iPhoneの写真アプリでは再生できない場合があります）' : ''}`;
      $('result').hidden = false;
      status('書き出しが終わりました。「MP4を保存」で端末に保存できます。');
      save();
    } catch (e) {
      console.error(e);
      status(`書き出しに失敗しました（${e && e.message || e}）。画質を「軽量」にして、もう一度試してください。`, true);
    } finally {
      busy = false; $('export').disabled = $('play').disabled = false; show(+$('scrub').value);
    }
  }

  async function save() {
    if (!blob) return;
    const filename = `madaowarenai_mv_${blob.h}p.${blob.ext}`;
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (dl) {
      try { await dl.save({ filename, data: blob }); status('保存しました。'); }
      catch (e) {
        const c = e && e.code;
        if (c === 'declined') status('保存をキャンセルしました。「MP4を保存」でもう一度保存できます。');
        else if (c === 'rate_limited') status('保存の確認画面がすでに開いています。少し待ってから「MP4を保存」を押してください。', true);
        else status('この画面からは保存できません。上の動画のメニュー（⋮ や右クリック）から保存してください。', true);
      }
      return;
    }
    const a = document.createElement('a');
    a.href = $('out').src; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    status('保存を開始しました。保存されない場合は、上の動画のメニュー（⋮ や右クリック）から保存してください。');
  }

  $('play').addEventListener('click', play);
  $('export').addEventListener('click', doExport);
  $('save').addEventListener('click', save);
  $('scrub').addEventListener('input', () => { stop(); show(+$('scrub').value); });
  document.querySelectorAll('.cue').forEach(c => c.addEventListener('click', () => { stop(); show(Math.round(+c.dataset.t * FPS)); }));

  Promise.all([window.ready, loadAudio()]).then(() => {
    $('loading').hidden = true;
    $('play').disabled = $('export').disabled = false;
    show(129);
  }).catch(e => {
    $('loading').textContent = '読み込みに失敗しました。ページを再読み込みしてください。';
    console.error(e);
  });
})();
</script>
